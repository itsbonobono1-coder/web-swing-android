(function(){

{id:'hero',n:'WEB HERO',p:0,c:{r:'#d62839',b:'#2a5bd7',k:'#14122b',w:'#fff'},web:'#fff',ws:1,ss:1,d:'THE CLASSIC HERO.'},
{id:'cyber',n:'CYBER',p:2000,c:{r:'#18c8e0',b:'#7a3cff',k:'#14122b',w:'#fff'},web:'#7fe9ff',ws:1,ss:1,d:'NEON SUIT, CYAN WEB.'},
{id:'gold',n:'GOLD STRIKER',p:3500,c:{r:'#f2b632',b:'#b8541f',k:'#14122b',w:'#fff'},web:'#ffe08a',ws:1,ss:1,d:'SHINY GOLD WEB.'},
{id:'ghost',n:'CRIMSON GHOST',p:5000,c:{r:'#eef0ff',b:'#d62839',k:'#14122b',w:'#14122b'},web:'#ff8a96',ws:1,ss:1,d:'WHITE SUIT, RED WEB.'},
{id:'noir',n:'NIGHT WEAVER',p:6000,c:{r:'#1b1b26',b:'#c9ccdd',k:'#000',w:'#fff'},web:'#fff',wk:'#000',ws:1,ss:1,d:'BLACK SUIT, WHITE+BLACK WEB.'},
{id:'venom',n:'DARK CRAWLER',p:10000,c:{r:'#0c0c12',b:'#25253a',k:'#000',w:'#fff'},web:'#07070c',wg:'#6d5cff',ws:3,ss:1.7,head:1,d:'BLACK GIANT WEB, BIG SHOTS.'}];

function spr(S,cx,cy,flip){for(let j=0;j<S.length;j++)for(let i=0;i<13;i++){const ch=S[j][i];if(ch!=='.')R(cx-6+i,flip?cy+6-j:cy-6+j,1,1,PAL[ch])}}
/* ---------- world art ---------- */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function mk(minw,maxw,minh,maxh,n){const a=[];let x=0;for(let i=0;i<n;i++){const w=minw+rnd()*(maxw-minw)|0;a.push({x,w,h:minh+rnd()*(maxh-minh)|0});x+=w+(rnd()*4|0)}return{a,P:x}}
const far=mk(14,26,90,170,14),mid=mk(18,32,60,120,12);
const hx=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));
const SKY=[['#6f9be0','#7fa6e6','#8fb0e8','#a3b9ea','#b9c2e8','#d4c4e0','#eac9d0','#f4d3c4'],['#3b3a8c','#5a4a9c','#8a5aa8','#b86aa0','#e07a8a','#f0906a','#f8b060','#fcd080'],['#080a1f','#0e1230','#151a44','#1c2258','#232a68','#2b3278','#333a86','#3c4392']].map(p=>p.map(hx));
let cur=SKY[0].map(a=>a.slice()),night=0;
const stars=[];for(let i=0;i<40;i++)stars.push({x:rnd()*W,y:rnd()*200,p:rnd()*6});
let off=0;
function layer(L,f,col,col2){const o=(off*f)%L.P;for(let k=-1;k<2;k++)for(const b of L.a){const x=b.x-o+k*L.P;if(x>W||x+b.w<0)continue;R(x,G-b.h,b.w,b.h,col);for(let yy=G-b.h+5;yy<G-8;yy+=9)for(let xx=x+3;xx<x+b.w-3;xx+=6)if(((xx*7+yy*3)|0)%5===0)R(xx,yy,2,3,col2)}}
function bridge(){const P=300,o=(off*.5)%P,tp=G-110,dk=G-34;for(let k=-1;k<2;k++){const tx=70-o+k*P;if(tx>W+P||tx<-P*1.2)continue;R(tx,tp,22,110,'#5e5880');R(tx-2,tp-4,26,5,'#4a4570');R(tx+5,tp+16,4,22,'#3a3558');R(tx+13,tp+16,4,22,'#3a3558');R(tx+5,tp+50,4,26,'#3a3558');R(tx+13,tp+50,4,26,'#3a3558');
for(let i=0;i<=P;i+=2){const t2=i/P,y=tp+2+44*4*t2*(1-t2);R(tx+11+i,y,2,1,'#6f6a94');if(i%12===0)R(tx+11+i,y,1,dk-y,'#4a4570')}}R(0,dk,W,3,'#4a4570')}
/* ---------- state ---------- */
let st='title',paused=false,t=0,spd=1.3,score=0,best=0,hero,obs,orbs,drones,birds,missiles,warns,items,parts,trail,nextX,deadT=0,flash=0,shake=0,
shield=false,inv=0,slow=0,mult=0,birdT=0,missT=0,stage=0,banner=0,newBest=false,web=null,shots=[],blast=null,atkCd=0,skillN=0,sg=0,b2=0,webCd=0,held=false,CH=CHARS[0],runCoins=0,nextAt=20,startAt=0,need=20,runSkill='blast',trial=null,magnet=0,saved=false,domeT=0,fzT=0,b3=0;
try{best=+localStorage.getItem('wsbest')||0}catch(e){}
function reset(){hero={x:48,y:150,vy:0,vx:0};web=null;shots=[];blast=null;atkCd=0;skillN=0;sg=0;b2=0;webCd=0;held=false;runCoins=0;saved=false;magnet=0;domeT=0;fzT=0;b3=0;need=SKD[runSkill].base;startAt=0;nextAt=need;obs=[];orbs=[];drones=[];birds=[];missiles=[];warns=[];items=[];parts=[];trail=[];score=0;spd=1.3;nextX=W+30;shield=false;inv=0;slow=0;mult=0;birdT=300;missT=500;stage=0;banner=0;newBest=false}
reset();
function add(n){score+=n*(mult>0?2:1)}
function burst(x,y,n){for(let i=0;i<(n||26);i++){const a=Math.random()*6.28,s=.6+Math.random()*2.2;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:['#d62839','#2a5bd7','#fff','#ffd36b'][i%4]})}}
function die(){st='dead';web=null;held=false;holds.clear();deadT=t;flash=1;shake=1;burst(hero.x,hero.y,40);SFX.die();if(score>best){best=score;newBest=true;try{localStorage.setItem('wsbest',best)}catch(e){}}endRun()}

function act(){au();if(st==='play')held=true}
function cn(n){runCoins+=n*(magnet>0?2:1)}

const BTN={pause:[2,2,16,16],mute:[W-18,2,16,16],atk:[W-36,H-36,30,30],skl:[6,H-36,30,30]};

const holds=new Set();

/* ---------- spawning ---------- */
function spawn(){const gap=Math.max(84,110-score*.8)|0,gy=30+Math.random()*(G-gap-60)|0,cy=gy+gap/2;obs.push({x:nextX,w:24,gy,gap,p:false});

/* ---------- update ---------- */
function update(k){if(paused)return;
const tg=SKY[stage%3];for(let i=0;i<8;i++)for(let j=0;j<3;j++)cur[i][j]+=(tg[i][j]-cur[i][j])*.02*k;night+=((stage%3===2?1:0)-night)*.02*k;

if(st==='play'){const dt=k/60;spd=1.1+Math.min(score*.0035,.9);slow=Math.max(0,slow-dt);mult=Math.max(0,mult-dt);fzT=Math.max(0,fzT-dt);domeT=Math.max(0,domeT-dt);magnet=Math.max(0,magnet-dt);inv=Math.max(0,inv-dt);banner=Math.max(0,banner-dt);

if(web){web.x-=s*k;if(web.x<hero.x-14){web=null;webCd=2}}
for(const b of shots){b.x+=6*k;
for(const d of drones)if(!d.dead&&!b.d&&Math.abs(d.x-b.x)<9*(b.r||1)&&Math.abs((d.yy!==undefined?d.yy:d.y)-b.y)<7*(b.r||1)){kill(d,'d');b.d=1}

for(const m of missiles)if(!m.dead&&!b.d&&Math.abs(m.x-b.x)<10*(b.r||1)&&Math.abs(m.y-b.y)<6*(b.r||1)){kill(m,'m');b.d=1}
for(const o of obs)if(!o.dead&&!b.d&&b.x>o.x&&b.x<o.x+o.w&&(b.y<o.gy||b.y>o.gy+o.gap)){b.d=1;burst(b.x,b.y,4)}}

for(const d of drones)if(!d.dead&&Math.hypot(d.x-bx,(d.yy!==undefined?d.yy:d.y)-by)<r)kill(d,'d');
for(const e of birds)if(!e.dead&&Math.hypot(e.x-bx,e.y-by)<r)kill(e,'b');

CHARS.forEach((ch,i)=>{const own=save.ownC[ch.id],c=save.ch[ch.id],sel=save.sel===ch.id;fixL(c);
h+='<div class="card'+(sel?' sel':'')+'"><img src="'+sprURL(ch)+'"><div class="ct"><b>'+ch.n+'</b><small>'+ch.d+'</small>'+(own?'<small>LIVES '+c.lives+'/5 '+(c.lives<5?tm(c):'')+'</small>':'')+'</div>'+
(own?(sel?'<button class="b dis">ON</button>':'<button class="b alt" data-a="sel" data-i="'+i+'">PICK</button>'):'<button class="b gold'+(save.coins<ch.p?' dis':'')+'" data-a="buyc" data-i="'+i+'">'+ch.p+'</button>')+'</div>'});
ui.className='on f';ui.innerHTML=h+'</div>'}
function skills(){uiS='skills';let h='<div class="hd"><span>SKILLS</span><span>$'+save.coins+'</span><button class="sm" data-a="back">BACK</button></div>'+(note?'<div class="note">'+note+'</div>':'')+'<div class="list">';
SK_KEYS.forEach((k,i)=>{const s=SKD[k],own=save.ownS[k],eq=save.skill===k;
h+='<div class="card'+(eq?' sel':'')+'"><div class="ct"><b>'+s.n+'</b><small>'+s.d+'</small><small>READY AT '+s.base+' PTS, +10 EACH USE</small></div><div class="col">'+
(own?(eq?'<button class="b dis">ON</button>':'<button class="b alt" data-a="eq" data-i="'+i+'">EQUIP</button>'):'<button class="b gold'+(save.coins<s.p?' dis':'')+'" data-a="buys" data-i="'+i+'">'+s.p+'</button><button class="b alt" data-a="trys" data-i="'+i+'">TRY (AD)</button>')+'</div></div>'});
ui.className='on f';ui.innerHTML=h+'</div>'}
function showOver(){if(st!=='dead')return;uiS='over';const c=cs();fixL(c);ui.className='on f';
ui.innerHTML='<div class="ttl">GAME OVER</div><div class="card2">SCORE '+score+'<br>BEST '+best+'<br>COINS +'+lastRun+'<br>'+(score>=KEEP?'LIFE SAVED!':'LIFE USED (NEED '+KEEP+' PTS)')+'<br>LIVES '+c.lives+'/5 '+(c.lives<5?tm(c):'')+'</div>'+
(c.lives<=0?'<button class="b gold" data-a="lifead">+1 LIFE (AD)</button>':'<button class="b" data-a="play">RETRY</button>')+
'<button class="b gold'+(dblDone||!lastRun?' dis':'')+'" data-a="dblad">DOUBLE COINS (AD)</button><button class="b alt" data-a="menu">MENU</button>'}
function noLives(){uiS='nol';const c=cs();ui.className='on f';
ui.innerHTML='<div class="ttl">NO LIVES</div><div class="card2">'+CHARS.find(x=>x.id===save.sel).n+' IS OUT OF LIVES.<br>REFILL IN '+tm(c)+'<br>OR PICK ANOTHER HERO.</div><button class="b gold" data-a="lifead">+1 LIFE (AD)</button><button class="b alt" data-a="heroes">HEROES</button><button class="b" data-a="menu">BACK</button>'}
function startGame(){au();const c=cs();if(fixL(c)<=0){noLives();return}
c.lives--;if(!c.ref)c.ref=Date.now()+H12;persist();runSkill=trial||save.skill;ui.className='';st='play';reset();hero.vy=-2.8;paused=false;SFX.start()}
function handle(a,i){i=+i;
if(a==='play')startGame();
else if(a==='heroes')heroes();else if(a==='skills')skills();
else if(a==='back'||a==='menu'){note='';st='title';reset();menu()}
else if(a==='mute'){setMute(!muted);menu()}
else if(a==='coinad')runAd(()=>{save.coins+=200;persist();menu()});
else if(a==='sel'){save.sel=CHARS[i].id;applyChar(save.sel);persist();heroes()}
else if(a==='buyc'){const h=CHARS[i];if(save.coins>=h.p){save.coins-=h.p;save.ownC[h.id]=1;save.sel=h.id;applyChar(h.id);persist();SFX.power()}heroes()}
else if(a==='eq'){save.skill=SK_KEYS[i];persist();skills()}
else if(a==='buys'){const k=SK_KEYS[i],s=SKD[k];if(save.coins>=s.p){save.coins-=s.p;save.ownS[k]=1;save.skill=k;persist();SFX.power()}skills()}
else if(a==='trys')runAd(()=>{trial=SK_KEYS[i];note='TRIAL READY: '+SKD[trial].n+' (1 USE)';skills()})
else if(a==='lifead')runAd(()=>{const x=cs();fixL(x);x.lives=Math.min(5,x.lives+1);if(x.lives<5&&!x.ref)x.ref=Date.now()+H12;persist();if(st==='dead')showOver();else menu()})
else if(a==='dblad')runAd(()=>{save.coins+=lastRun;dblDone=true;persist();showOver()})}
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.classList.contains('dis'))return;au();handle(b.dataset.a,b.dataset.i)});
setInterval(()=>{document.querySelectorAll('[data-ref]').forEach(n=>{const r=+n.dataset.ref;n.textContent=fmt(r-Date.now());if(r<=Date.now()){if(uiS==='menu'||uiS==='nol')menu();else if(uiS==='heroes')heroes()}})},1000);
menu();
let last=performance.now();
function loop(n){const dt=Math.min(n-last,50);last=n;t+=dt/1000;try{update(dt/16.667);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
})();
</script></body></html>
