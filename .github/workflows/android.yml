
name: Build Web Swing APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Arrange project files
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then mv index.html www/; fi
          if [ -f ads.js ]; then mv ads.js www/; fi
          if [ -f icon-only.png ]; then mv icon-only.png assets/; fi
          if [ -f splash.png ]; then mv splash.png assets/; fi
          if [ -f splash-dark.png ]; then mv splash-dark.png assets/; fi

      - name: Prepare Android project
        run: npm run setup

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: web-swing-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
